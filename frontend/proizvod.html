<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proizvod — AMARA</title>
<link rel="stylesheet" href="stil.css">
<style>
  .product-detail{ padding: 48px 0 100px; }
  .product-detail__grid{
    display: grid; grid-template-columns: 1fr 1fr; gap: 56px; align-items: start;
  }
  .product-detail__photos{ display: grid; gap: 14px; }
  .product-detail__photo{
    aspect-ratio: 3/4; background: var(--bg-raised); border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Italiana', serif; font-style: italic; color: var(--ink-soft); font-size: 15px;
  }
  .product-detail__info{ position: sticky; top: 110px; }
  .product-detail__breadcrumb{ font-size: 13px; color: var(--ink-soft); margin-bottom: 18px; }
  .product-detail__name{ font-family: 'Italiana', serif; font-size: 34px; margin: 0 0 10px; }
  .product-detail__price{ font-size: 19px; margin-bottom: 22px; }
  .product-detail__desc{ color: var(--ink-soft); line-height: 1.65; margin-bottom: 30px; max-width: 44ch; }

  .option-group{ margin-bottom: 26px; }
  .option-group h4{ font-size: 13px; text-transform: uppercase; letter-spacing: .05em; margin: 0 0 12px; }
  .color-options{ display: flex; gap: 10px; }
  .color-option{
    width: 34px; height: 34px; border-radius: 50%; cursor: pointer; border: 2px solid transparent;
  }
  .color-option.selected{ border-color: var(--ink); }

  .size-options{ display: flex; gap: 10px; }
  .size-btn{
    width: 52px; height: 44px; border: 1px solid var(--line-strong); background: var(--white);
    font-size: 14px; border-radius: 3px; transition: border-color .2s ease, background .2s ease;
  }
  .size-btn:hover:not(.disabled){ border-color: var(--ink); }
  .size-btn.selected{ background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .size-btn.disabled{
    color: var(--line-strong); border-color: var(--line);
    text-decoration: line-through; cursor: not-allowed; background: var(--bg);
  }

  .qty-row{ display: flex; align-items: center; gap: 14px; margin-bottom: 26px; }
  .qty-control{ display: flex; align-items: center; border: 1px solid var(--line-strong); border-radius: 4px; }
  .qty-control button{ width: 36px; height: 38px; background: none; border: none; font-size: 16px; }
  .qty-control span{ width: 32px; text-align: center; font-size: 14px; }

  .add-to-cart-btn{
    width: 100%; padding: 16px; background: var(--ink); color: var(--bg); border: none;
    font-size: 15px; letter-spacing: .02em; border-radius: 4px; transition: background .2s ease;
  }
  .add-to-cart-btn:hover{ background: var(--accent); }
  .add-to-cart-btn:disabled{ background: var(--line-strong); cursor: not-allowed; }

  .stock-note{ font-size: 13px; color: var(--ink-soft); margin-top: 12px; }
  .sold-out-banner{
    background: var(--accent-soft); color: var(--accent); padding: 12px 16px; border-radius: 4px;
    font-size: 14px; margin-bottom: 22px;
  }
  .added-toast{
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: var(--bg); padding: 14px 24px; border-radius: 30px;
    font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .3s ease, transform .3s ease;
    z-index: 900;
  }
  .added-toast.show{ opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 800px){
    .product-detail__grid{ grid-template-columns: 1fr; }
    .product-detail__info{ position: static; }
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="logo">AMARA<span class="demo-tag">DEMO</span></a>
    <nav class="header-nav">
      <a href="proizvodi.html?pol=zensko">Žensko</a>
      <a href="proizvodi.html?pol=musko">Muško</a>
      <a href="proizvodi.html">Sve</a>
    </nav>
    <div class="header-actions">
      <a href="korpa.html" class="cart-link">Korpa <span class="cart-count" id="cartCount">0</span></a>
    </div>
  </div>
</header>

<div class="container product-detail" id="productDetail"></div>

<footer class="site-footer">
  AMARA<span class="demo-tag">DEMO</span> — demo prodavnica, DANN.web.workshop
</footer>

<div class="added-toast" id="addedToast">Dodato u korpu</div>

<script src="podaci.js"></script>
<script src="korpa.js"></script>
<script src="prodavnica-api.js"></script>
<script>
ucitajProizvode(function(){
(function(){
  const urlParams = new URLSearchParams(window.location.search);
  const id = parseInt(urlParams.get('id'), 10);
  const p = nadjiProizvod(id);
  const wrap = document.getElementById('productDetail');

  if (!p) {
    wrap.innerHTML = '<p>Proizvod nije pronađen. <a href="proizvodi.html">Nazad u prodavnicu →</a></p>';
    return;
  }

  document.title = p.naziv + ' — AMARA';

  let izabranaBoja = p.boje[0];
  let izabranaVelicina = null;
  let kolicina = 1;

  function preostaliZaVelicinu(velicina){
    const inv = p.inventar[velicina];
    return inv ? Math.max(0, inv.zaliha - inv.prodato) : 0;
  }

  const nemaNiStaVelicine = PRODAVNICA_DATA.velicine.every(function(v){ return preostaliZaVelicinu(v) <= 0; });

  function bojaCss(b){ return b === 'Crna' ? '#201F1C' : (b === 'Bez' ? '#E4D9C4' : '#6B2737'); }

  function render(){
    wrap.innerHTML =
      '<div class="product-detail__grid">' +
        '<div class="product-detail__photos">' +
          '<div class="product-detail__photo">' + (p.foto1 ? '<img src="' + p.foto1 + '" alt="' + p.naziv + '" style="width:100%;height:100%;object-fit:cover;">' : p.naziv + ' — foto 1') + '</div>' +
          '<div class="product-detail__photo">' + (p.foto2 ? '<img src="' + p.foto2 + '" alt="' + p.naziv + '" style="width:100%;height:100%;object-fit:cover;">' : p.naziv + ' — foto 2') + '</div>' +
        '</div>' +
        '<div class="product-detail__info">' +
          '<div class="product-detail__breadcrumb">' + (p.pol === 'zensko' ? 'Žensko' : 'Muško') + ' / ' + p.kategorijaNaziv + '</div>' +
          '<h1 class="product-detail__name">' + p.naziv + '</h1>' +
          '<div class="product-detail__price">' + formatCena(p.cena) + '</div>' +
          (nemaNiStaVelicine ? '<div class="sold-out-banner">Trenutno nije na stanju</div>' : '') +
          '<p class="product-detail__desc">' + p.opis + '</p>' +

          '<div class="option-group">' +
            '<h4>Boja — ' + izabranaBoja + '</h4>' +
            '<div class="color-options">' +
              p.boje.map(function(b){
                return '<span class="color-option' + (b === izabranaBoja ? ' selected' : '') + '" style="background:' + bojaCss(b) + '" data-boja="' + b + '"></span>';
              }).join('') +
            '</div>' +
          '</div>' +

          '<div class="option-group">' +
            '<h4>Veličina</h4>' +
            '<div class="size-options">' +
              PRODAVNICA_DATA.velicine.map(function(v){
                const dostupno = preostaliZaVelicinu(v) > 0;
                const cls = 'size-btn' + (!dostupno ? ' disabled' : '') + (v === izabranaVelicina ? ' selected' : '');
                return '<button class="' + cls + '" data-vel="' + v + '"' + (!dostupno ? ' disabled' : '') + '>' + v + '</button>';
              }).join('') +
            '</div>' +
          '</div>' +

          '<div class="qty-row">' +
            '<h4 style="margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.05em;">Količina</h4>' +
            '<div class="qty-control">' +
              '<button id="qtyMinus">−</button><span id="qtyVal">' + kolicina + '</span><button id="qtyPlus">+</button>' +
            '</div>' +
          '</div>' +

          '<button class="add-to-cart-btn" id="addBtn"' + (nemaNiStaVelicine ? ' disabled' : '') + '>' +
            (nemaNiStaVelicine ? 'Nije na stanju' : 'Dodaj u korpu') +
          '</button>' +
          (!nemaNiStaVelicine ? '<p class="stock-note" id="stockNote">Izaberite veličinu</p>' : '') +
        '</div>' +
      '</div>';

    wrap.querySelectorAll('.color-option').forEach(function(el){
      el.addEventListener('click', function(){ izabranaBoja = el.dataset.boja; render(); });
    });
    wrap.querySelectorAll('.size-btn:not(.disabled)').forEach(function(el){
      el.addEventListener('click', function(){ izabranaVelicina = el.dataset.vel; render(); });
    });
    const qtyMinus = document.getElementById('qtyMinus');
    const qtyPlus = document.getElementById('qtyPlus');
    if (qtyMinus) qtyMinus.addEventListener('click', function(){ if (kolicina > 1) { kolicina--; document.getElementById('qtyVal').textContent = kolicina; } });
    if (qtyPlus) qtyPlus.addEventListener('click', function(){ kolicina++; document.getElementById('qtyVal').textContent = kolicina; });

    const addBtn = document.getElementById('addBtn');
    if (addBtn && !nemaNiStaVelicine) {
      addBtn.addEventListener('click', function(){
        if (!izabranaVelicina) {
          document.getElementById('stockNote').textContent = 'Molimo izaberite veličinu pre dodavanja u korpu.';
          document.getElementById('stockNote').style.color = '#6B2737';
          return;
        }
        dodajUKorpu(p.id, izabranaBoja, izabranaVelicina, kolicina);
        const toast = document.getElementById('addedToast');
        toast.classList.add('show');
        setTimeout(function(){ toast.classList.remove('show'); }, 2200);
      });
    }
  }

  render();
})();
});
</script>
</body>
</html>
